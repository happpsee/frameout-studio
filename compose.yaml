name: frameout

services:
  app:
    image: frameout:${FRAMEOUT_IMAGE_TAG:-local}
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      FRAMEOUT_FRONTEND_DIST: /app/frontend/dist
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FRAMEOUT_DOMAIN: "${FRAMEOUT_DOMAIN:?Set FRAMEOUT_DOMAIN in deploy/.env}"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
