<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRAMEOUT API 模拟集成验收</title>
<style>
  :root{color-scheme:dark;font:14px/1.6 system-ui,sans-serif;background:#151613;color:#f5f5f0}
  body{margin:24px}h1{font-size:24px;margin:0 0 8px}p{max-width:1080px;color:#afb6a4}strong{color:#d9f5b8}
  button{font:inherit;padding:9px 16px;margin:0 8px 8px 0;background:#b5ff2a;color:#151613;border:0;border-radius:4px;cursor:pointer}button:disabled{opacity:.4;cursor:wait}
  #summary{font-weight:700;margin:12px 0}#results{padding-left:24px;max-width:1350px}.pass{color:#c3ed96}.fail{color:#ff9e94}
  #frame-host{max-width:100%;overflow:auto;border:1px solid #48533c;background:#080b06}iframe{display:block;border:0;background:#151613}
</style>
<h1>FRAMEOUT API 模拟集成验收</h1>
<p><strong>本页只使用假密钥和模拟响应，不调用真实供应商、不产生生成费用，也不证明真实出图。</strong>实际 UI、前端兼容层、浏览器素材缓存与项目导出均参与测试。所有 API fetch 会被 mock 拦截；未预期的外部请求直接报错。模拟视频仅检查任务状态与缓存，不验证编码播放。本页应在专用的 <strong>4189 测试端口</strong>打开，运行前会清理该测试来源的 FRAMEOUT 素材缓存，结束后恢复原有项目与偏好文本。</p>
<div><button id="desktop">模拟验收 1440 × 900</button><button id="mobile">模拟验收 390 × 844</button><button id="both">模拟验收两种尺寸</button></div>
<div id="summary" role="status" aria-live="polite">尚未运行</div>
<ol id="results"></ol>
<div id="frame-host"></div>
<script>
(() => {
  'use strict';
  const PROJECT_KEY = 'frameout-studio-v1';
  const PREFERENCE_KEY = 'frameout-ai-preferences-v1';
  const DATABASE = 'frameout-media-v1';
  const FAKE_KEYS = { openai:'fixture-openai-key-never-live', ark:'fixture-ark-key-never-live' };
  const fakeVideo = 'data:video/mp4;base64,AAAAHGZ0eXBpc29tAAAAAGlzb21pc28yYXZjMW1wNDE=';
  const fixtureCanvas = document.createElement('canvas');
  fixtureCanvas.width = fixtureCanvas.height = 1;
  fixtureCanvas.getContext('2d').fillRect(0, 0, 1, 1);
  const fakeImageBase64 = fixtureCanvas.toDataURL('image/png').split(',')[1];
  const summary = document.getElementById('summary');
  const results = document.getElementById('results');
  const frameHost = document.getElementById('frame-host');
  const buttons = Array.from(document.querySelectorAll('button'));
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  let passed = 0, failed = 0, running = false;

  async function until(condition, message, timeout = 6000) {
    const deadline = Date.now() + timeout;
    while (Date.now() < deadline) {
      if (condition()) return;
      await delay(25);
    }
    throw new Error(message);
  }

  async function test(mode, name, fn) {
    const item = document.createElement('li');
    results.append(item);
    try {
      const detail = await fn();
      item.className = 'pass'; item.textContent = `PASS · ${mode} · ${name}${detail ? ' · '+detail : ''}`; passed++;
    } catch (error) {
      item.className = 'fail'; item.textContent = `FAIL · ${mode} · ${name} · ${error.message || error}`; failed++;
    }
    summary.textContent = `模拟验收运行中：${passed} PASS / ${failed} FAIL`;
  }

  async function clearTestDatabase() {
    await new Promise((resolve, reject) => {
      const request = indexedDB.deleteDatabase(DATABASE);
      const timer = setTimeout(() => reject(new Error('测试素材缓存清理超时，请关闭其他 4189 测试标签')), 4000);
      const done = action => { clearTimeout(timer); action(); };
      request.onsuccess = () => done(resolve);
      request.onerror = () => done(() => reject(new Error('无法清理专用测试素材缓存')));
      request.onblocked = () => done(() => reject(new Error('素材缓存被其他 4189 测试标签占用')));
    });
  }

  async function runMode(width, height) {
    const mode = `${width}×${height}（模拟 API）`;
    let frame, context;
    const scenario = { image:'success', video:'queued', calls:[], blocked:[], exports:[], errors:[] };
    const responseJSON = (w, body, status = 200) => new w.Response(JSON.stringify(body), { status, headers:{'content-type':'application/json'} });
    try {
      localStorage.removeItem(PROJECT_KEY); localStorage.removeItem(PREFERENCE_KEY);
      await clearTestDatabase();
      frame = document.createElement('iframe');
      frame.title = `${width} × ${height} FRAMEOUT 模拟 API 测试`;
      frame.width = width; frame.height = height;
      frame.style.width = width + 'px'; frame.style.height = height + 'px';
      frameHost.replaceChildren(frame);

      function installMocks(w) {
        const realFetch = w.fetch.bind(w);
        w.fetch = async (input, init = {}) => {
          const address = new w.URL(typeof input === 'string' ? input : input.url, w.location.href);
          if (address.origin === w.location.origin && address.pathname === '/api/ai') {
            if (init.signal?.aborted) throw new w.DOMException('Fixture abort', 'AbortError');
            const envelope = JSON.parse(init.body || '{}');
            scenario.calls.push({ provider:envelope.provider, method:envelope.method, path:envelope.path });
            assert(envelope.apiKey === FAKE_KEYS[envelope.provider], '模拟请求缺少当前供应商的假密钥');
            if (envelope.provider === 'openai' && envelope.method === 'GET' && envelope.path === '/models') {
              return responseJSON(w, { data:[{ id:'fixture-image-model' }] });
            }
            if (envelope.provider === 'ark' && envelope.method === 'GET' && envelope.path === '/contents/generations/tasks?page_size=1') {
              return responseJSON(w, { items:[], total:0 });
            }
            if (envelope.method === 'POST' && envelope.path === '/images/generations') {
              if (scenario.image === '401') return responseJSON(w, { error:{ message:'fixture rejected '+envelope.apiKey } }, 401);
              return responseJSON(w, { data:[{ b64_json:fakeImageBase64 }], output_format:'png' });
            }
            if (envelope.provider === 'ark' && envelope.method === 'POST' && envelope.path === '/contents/generations/tasks') {
              assert(!envelope.body.content.some(item => item.type === 'image_url'), '文生视频不应意外带入首帧');
              return responseJSON(w, { id:'fixture-video-job-1', status:'queued', model:'fixture-video-model' });
            }
            if (envelope.provider === 'ark' && envelope.method === 'GET' && envelope.path === '/contents/generations/tasks/fixture-video-job-1') {
              return responseJSON(w, scenario.video === 'succeeded'
                ? { id:'fixture-video-job-1', status:'succeeded', model:'fixture-video-model', content:{video_url:fakeVideo} }
                : { id:'fixture-video-job-1', status:'running', progress:20 });
            }
            scenario.blocked.push(envelope.method + ' ' + envelope.path);
            throw new Error('未预期的 API 已被模拟层阻止');
          }
          if (address.protocol === 'data:' || address.protocol === 'blob:') return realFetch(input, init);
          if (address.origin === w.location.origin && !address.pathname.startsWith('/api/')) return realFetch(input, init);
          scenario.blocked.push(address.origin + address.pathname);
          throw new Error('未预期的外部 fetch 已被模拟层阻止');
        };
        const realCreate = w.URL.createObjectURL.bind(w.URL);
        w.URL.createObjectURL = blob => {
          if (blob.type === 'application/json') scenario.exports.push(blob);
          return realCreate(blob);
        };
        const realAnchorClick = w.HTMLAnchorElement.prototype.click;
        w.HTMLAnchorElement.prototype.click = function() {
          if (this.download === 'frameout-project.json') return;
          return realAnchorClick.call(this);
        };
        w.addEventListener('error', event => {
          if (event.target === w) scenario.errors.push(event.message);
        });
        w.addEventListener('unhandledrejection', event => scenario.errors.push(String(event.reason)));
      }

      async function loadFrame() {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('实际画布加载超时')), 10000);
          frame.onload = () => { clearTimeout(timer); resolve(); };
          frame.src = '../index.html?ai-fixture=' + Date.now() + '#studio';
        });
        const w = frame.contentWindow, d = w.document;
        installMocks(w);
        await until(() => w.FrameoutStudio && d.querySelector('#studio-root') && !d.querySelector('#studio-root').hidden, '实际画布未初始化');
        await delay(250);
        context = { w, d };
      }

      const q = selector => {
        const element = context.d.querySelector(selector);
        assert(element, '缺少 UI：'+selector);
        return element;
      };
      const state = () => context.w.FrameoutStudio.getState();
      const click = selector => q(selector).click();
      const event = (element, type) => element.dispatchEvent(new context.w.Event(type, { bubbles:true,cancelable:true }));
      const set = (selector, value) => { const field = q(selector); field.value = value; event(field, field.tagName === 'SELECT' ? 'change' : 'input'); };
      const setMode = value => set('.fo-generation-mode', value);
      const noSecret = text => { for (const key of Object.values(FAKE_KEYS)) assert(!text.includes(key), '假密钥不应进入持久化项目或导出文本'); };
      const apiCalls = predicate => scenario.calls.filter(predicate);
      const isVideoSubmit = value => value.method === 'POST' && value.path === '/contents/generations/tasks';
      async function configure(provider = 'openai', testConnection = false) {
        click('[data-action="api-settings"]');
        assert(q('.fo-api-dialog').open, 'API 设置未打开');
        set('.fo-api-provider', provider);
        set('.fo-api-key', FAKE_KEYS[provider]);
        set('.fo-api-image-model', 'fixture-image-model');
        if (provider === 'ark') {
          set('.fo-api-video-model', 'fixture-video-model');
          set('.fo-api-duration', '5');
        }
        if (testConnection) {
          click('.fo-api-test');
          await until(() => q('.fo-api-status').dataset.state === 'success', '模拟连接测试未通过');
        }
        event(q('.fo-api-form'), 'submit');
        await until(() => !q('.fo-api-dialog').open, '设置没有保存关闭');
      }
      async function generate(prompt) {
        set('.fo-prompt', prompt);
        click('[data-action="generate"]');
      }
      const idle = () => !q('[data-action="generate"]').disabled;
      const waitIdle = () => until(idle, '生成流程未回到可操作状态');

      await loadFrame();
      await test(mode, 'API 设置保存与无费用连接测试', async () => {
        await configure('openai', true);
        assert(apiCalls(value => value.path === '/models').length === 1, '连接测试应只查询模型列表');
        assert(apiCalls(value => value.path === '/images/generations').length === 0, '连接测试不应发起生成');
        noSecret(localStorage.getItem(PREFERENCE_KEY) || '');
      });
      await test(mode, '设置窗口与表单不超出当前视口', async () => {
        click('[data-action="api-settings"]');
        const box = q('.fo-api-dialog').getBoundingClientRect();
        assert(box.left >= -1 && box.right <= width+1 && box.top >= -1 && box.bottom <= height+1, `设置窗口越界：${Math.round(box.width)}×${Math.round(box.height)}`);
        for (const field of context.d.querySelectorAll('.fo-api-dialog input,.fo-api-dialog select')) {
          const rect = field.getBoundingClientRect();
          if (rect.width) assert(rect.left >= box.left-1 && rect.right <= box.right+1, '设置输入框水平溢出');
        }
        click('.fo-api-close');
      });
      let imageId, mediaId;
      await test(mode, '模拟 OpenAI 图片结果进入画布并写入浏览器素材缓存', async () => {
        const before = state().cards.length;
        setMode('image');
        await generate('模拟图片结果，只用于集成测试');
        await until(() => state().cards.length === before+1 && idle(), '模拟图片结果未加入画布');
        const card = state().cards.find(value => value.provider === 'openai');
        assert(card && card.kind === 'image' && card.mediaId && card.src.startsWith('blob:'), '生成结果应有 mediaId 与 blob 地址');
        imageId = card.id; mediaId = card.mediaId;
        const stored = await context.w.FrameoutMediaStore.get(mediaId);
        assert(stored && stored.type === 'image/png' && stored.size > 0, 'IndexedDB 没有保存模拟 PNG');
        await delay(600);
      });
      await test(mode, '项目存档与导出 JSON 均不包含密钥', async () => {
        noSecret(localStorage.getItem(PROJECT_KEY) || '');
        const before = scenario.exports.length;
        click('[data-action="export"]');
        assert(scenario.exports.length === before+1, '未拦截到项目导出 Blob');
        const text = await scenario.exports.at(-1).text();
        noSecret(text);
        const exported = JSON.parse(text);
        const card = exported.cards.find(value => value.id === imageId);
        assert(card?.mediaId === mediaId && card.src === '' && card.relinkRequired === true, '导出应保留媒体引用而非失效 blob 地址');
      });
      await test(mode, '刷新后从 IndexedDB 恢复生成素材', async () => {
        await loadFrame();
        await until(() => state().cards.some(value => value.id === imageId && value.mediaId === mediaId && value.src.startsWith('blob:') && !value.missingMedia), '刷新后生成素材未恢复');
        assert(q('.fo-generation-state').textContent.includes('先配置'), '刷新后密钥应清空，要求重新配置');
      });
      await test(mode, '401 失败不添加示例卡，并脱敏错误文本', async () => {
        await configure('openai');
        scenario.image = '401';
        const before = state().cards.length;
        await generate('模拟鉴权失败，不应出现替代图片');
        await waitIdle();
        assert(state().cards.length === before, '请求失败时错误加入了素材卡');
        noSecret(q('.fo-toast').textContent);
        assert(/Key|鉴权|无效/.test(q('.fo-toast').textContent), '没有显示鉴权失败原因');
        scenario.image = 'success';
      });
      let videoId;
      await test(mode, '视频等待中保护撤销，停止后保留任务号并恢复撤销', async () => {
        await configure('ark'); setMode('video');
        await generate('模拟视频任务，不调用真实供应商');
        await until(() => state().cards.some(value => value.job?.id === 'fixture-video-job-1'), '视频提交没有保留任务号');
        const card = state().cards.find(value => value.job?.id === 'fixture-video-job-1'); videoId = card.id;
        const count = state().cards.length;
        assert(q('[data-action="undo"]').disabled, '任务等待中撤销按钮应禁用');
        const keyboardTarget = q('[data-action="api-settings"]');
        keyboardTarget.focus({ preventScroll:true });
        for (const modifier of ['ctrlKey','metaKey']) {
          keyboardTarget.dispatchEvent(new context.w.KeyboardEvent('keydown', { key:'z', code:'KeyZ', [modifier]:true, bubbles:true, cancelable:true }));
          const retained = state().cards.find(value => value.id === videoId);
          assert(state().cards.length === count && retained?.job.id === 'fixture-video-job-1', 'Ctrl/Cmd Z 不应移除等待卡或丢失任务号');
        }
        click('[data-action="cancel-generation"]');
        await until(() => state().cards.find(value => value.id === videoId)?.job.status === 'paused' && idle(), '停止等待没有保留可查询任务');
        assert(!q('[data-action="undo"]').disabled, '停止等待后应恢复撤销操作');
        assert(apiCalls(isVideoSubmit).length === 1, '停止等待不应重提任务');
        noSecret(localStorage.getItem(PROJECT_KEY) || '');
      });
      await test(mode, '继续查询原任务号并完成，不重复提交视频', async () => {
        scenario.video = 'succeeded';
        click('.fo-selection-actions [data-action="resume-video"]');
        await until(() => state().cards.find(value => value.id === videoId)?.job.status === 'succeeded' && idle(), '模拟视频查询未完成');
        const card = state().cards.find(value => value.id === videoId);
        assert(card.kind === 'video' && card.mediaId && card.src.startsWith('blob:'), '完成任务没有转成浏览器缓存视频');
        assert(apiCalls(isVideoSubmit).length === 1, '继续查询错误重新提交了付费任务');
        assert(apiCalls(value => value.method === 'GET' && value.path === '/contents/generations/tasks/fixture-video-job-1').length >= 1, '没有查询原任务号');
        assert(card.duration === 5, '完成卡片应保留模拟任务的 5 秒时长');
        click('.fo-selection-actions [data-action="add"]');
        const shot = state().sequence.find(value => value.cardId === videoId);
        assert(shot?.duration === 5, '真实视频加入成片时不应固定截成 4 秒');
        const media = q(`.fo-card[data-id="${videoId}"] .fo-media`);
        media.dispatchEvent(new context.w.MouseEvent('dblclick', { bubbles:true,cancelable:true }));
        assert(q('.fo-preview-dialog').open, '双击视频未打开单素材预览');
        assert(Number(q('.fo-preview-progress').max) === 5, '单素材预览时长应为 5 秒');
        assert(q('.fo-preview-time').textContent.includes('/ 00:05'), '单素材预览时间文案未保留 5 秒');
        click('[data-action="close-preview"]');
        click('[data-action="preview"]');
        assert(q('.fo-preview-dialog').open && Number(q('.fo-preview-progress').max) === 5, '成片预览应使用镜头的 5 秒时长');
        click('[data-action="close-preview"]');
        return '5 秒任务保持 5 秒镜头与预览；不验证视频编码播放';
      });
      await test(mode, '清除密钥后真实生成会打开设置，不发送 API', async () => {
        click('[data-action="api-settings"]'); click('.fo-api-clear'); click('.fo-api-close');
        const before = scenario.calls.length;
        setMode('image'); await generate('清除密钥后必须重新配置');
        assert(q('.fo-api-dialog').open, '缺少密钥时没有打开设置');
        assert(scenario.calls.length === before, '缺少密钥仍然发送了 API 请求');
        click('.fo-api-close');
      });
      await test(mode, 'OpenAI 官方视频模式在前端阻止请求', async () => {
        await configure('openai'); setMode('video');
        const before = scenario.calls.length, cards = state().cards.length;
        await generate('官方视频已下线，应选择可用供应商');
        assert(q('.fo-api-dialog').open, '官方视频不可用时没有打开供应商设置');
        assert(q('.fo-api-capability-note').textContent.includes('已下线'), '没有解释官方视频能力状态');
        assert(scenario.calls.length === before && state().cards.length === cards, '不可用的官方视频模式不应发送请求或创建任务');
        click('.fo-api-close');
      });
      await test(mode, '所有 API 请求被模拟层接管，无未处理页面异常', () => {
        assert(scenario.blocked.length === 0, '出现未预期请求：'+scenario.blocked.join('；'));
        assert(scenario.errors.length === 0, scenario.errors.join('；'));
        return `已拦截 ${scenario.calls.length} 次 API fetch，未请求真实供应商`;
      });
    } catch (error) {
      await test(mode, '模拟验收初始化', () => { throw error; });
    } finally {
      if (frame) frame.remove();
      await delay(30);
    }
  }

  async function run(modes) {
    if (running) return;
    running = true; passed = 0; failed = 0; results.replaceChildren();
    buttons.forEach(button => button.disabled = true);
    summary.textContent = '正在加载模拟 API 验收…'; summary.dataset.testStatus = 'running';
    const backup = new Map([PROJECT_KEY,PREFERENCE_KEY].map(key => [key,localStorage.getItem(key)]));
    try { for (const dimensions of modes) await runMode(...dimensions); }
    finally {
      frameHost.replaceChildren();
      for (const [key,value] of backup) { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key,value); }
      running = false; buttons.forEach(button => button.disabled = false);
      summary.textContent = `模拟 API 验收完成：${passed} PASS / ${failed} FAIL。全部使用模拟响应，尚未验证真实供应商出图。`;
      summary.dataset.testStatus = failed ? 'failed' : 'passed';
      summary.dataset.passed = String(passed); summary.dataset.failed = String(failed);
      document.title = `FRAMEOUT 模拟 API ${passed} PASS / ${failed} FAIL`;
    }
  }
  document.getElementById('desktop').onclick = () => run([[1440,900]]);
  document.getElementById('mobile').onclick = () => run([[390,844]]);
  document.getElementById('both').onclick = () => run([[1440,900],[390,844]]);
  const mode = new URLSearchParams(location.search).get('mode');
  run(mode === 'both' ? [[1440,900],[390,844]] : mode === 'mobile' ? [[390,844]] : [[1440,900]]);
})();
</script>
</html>
