[project]
name = "frameout-api"
version = "2.0.0"
description = "帧外后端：账号、项目、Key 保险箱、任务与用量。只供 BFF 在内网调用。"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx2>=2.16",
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
