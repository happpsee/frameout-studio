name: 功能建议 / Feature request
description: 想要一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 从使用场景说起，比只描述方案更有帮助
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
  - type: checkboxes
    id: help
    attributes:
      label: 参与
      options:
        - label: 我愿意自己提 PR 实现
