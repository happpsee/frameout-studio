packages:
  - apps/*
  - packages/*

# One version of each shared tool across the workspace ("catalog:" in package.json).
catalog:
  '@types/node': ^22.19.0
  esbuild: 0.28.2
  typescript: ^5.9.3
  vitest: ^3.2.4

# Install only versions published at least a day ago (pnpm 11's default, written out).
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
